<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - SecureVote</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .offline-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        
        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #e74c3c;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .retry-btn {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        
        .features {
            margin-top: 30px;
            text-align: left;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: #7f8c8d;
        }
        
        .feature-icon {
            margin-right: 10px;
            color: #27ae60;
        }
        
        @media (max-width: 600px) {
            .offline-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .offline-icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>Sem Conexão</h1>
        <p class="subtitle">
            Você está offline no momento. Verifique sua conexão com a internet e tente novamente.
        </p>
        
        <button class="retry-btn" onclick="window.location.reload()">
            🔄 Tentar Novamente
        </button>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon">✓</span>
                <span>Seus dados estão seguros</span>
            </div>
            <div class="feature">
                <span class="feature-icon">✓</span>
                <span>Funcionalidades básicas disponíveis offline</span>
            </div>
            <div class="feature">
                <span class="feature-icon">✓</span>
                <span>Sincronização automática quando online</span>
            </div>
        </div>
    </div>
    
    <script>
        // Verificar conexão periodicamente
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
        
        // Escutar eventos de conexão
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
